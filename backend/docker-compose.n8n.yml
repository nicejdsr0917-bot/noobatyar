# n8n: periodic refresh of the doctor / insurance directory.
#
# Standalone on purpose: its own compose project, network and volume. It has NO
# database credentials and NO shared volumes; the only thing it can do to
# Noobatyar is call POST /api/internal/directory-sync/ with the bearer token
# (additive, unclaimed listings only; see backend/business/directory_sync.py).
#
# Local:  docker compose -f docker-compose.n8n.yml --env-file .env.n8n up -d
#         then open http://localhost:5679 (bound to 127.0.0.1 only; change with
#         N8N_HOST_PORT if 5679 is taken).
#         Django runs on the host (runserver :8000) -> http://host.docker.internal:8000
# Server: add the `web` network below (external, name = the main project's
#         default network) and call http://web:8000 instead; keep the port bound
#         to 127.0.0.1 and use an SSH tunnel to reach the editor.
name: noobatyar-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}   # pin a version once it works
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5679}:5678"   # never publish on 0.0.0.0 / behind nginx
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env.n8n}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}   # true once served over HTTPS
      - WEBHOOK_URL=http://localhost:${N8N_HOST_PORT:-5679}/
      - GENERIC_TIMEZONE=Asia/Tehran
      - TZ=Asia/Tehran
      # Telemetry / phone-home off.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      # Hardening: nodes that run shell commands / touch the container's disk
      # are removed; workflows can't read the container environment.
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      # Keep the SQLite file small.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 700m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  n8n_data:
