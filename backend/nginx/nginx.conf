upstream web_app {
    server web:8000;
    keepalive 32;
}

# ── Rate limiting / compression / proxy timeouts (http context) ──────────────
# 429 rather than the default 503 so clients can tell throttling from outage.
# Per IP, and Iranian carriers put many subscribers behind one CGNAT address,
# so this is only a flood guard; the per-phone DRF throttles do the real work.
limit_req_zone $binary_remote_addr zone=auth:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
limit_req_status 429;

gzip on;
gzip_min_length 1024;
gzip_types application/json text/css application/javascript text/plain;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

upstream frontend_app {
    server frontend:3000;
}

# TLS parameters written inline rather than including
# /etc/letsencrypt/options-ssl-nginx.conf: that file ships with the
# python3-certbot-nginx plugin, which this setup does not install (certbot runs
# standalone on the host). Including a missing file stops nginx from starting.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# No nginx version in error pages or the Server header.
server_tokens off;

# ── Security headers ─────────────────────────────────────────────────────────
# nginx drops every server-level add_header inside a location that sets its
# own, so the shared set lives in variables and /media/ repeats it in full.
#
# HSTS without includeSubDomains: the bare noobatyar.ir is a separate
# WordPress host whose other subdomains are not ours to pin to HTTPS.
map $host $nb_hsts { default "max-age=31536000"; }

# Media (logos, receipts) is served by nginx itself, so Django's CORS
# middleware never sees it. The panel draws images on a canvas and so has to
# fetch() them cross-origin from api.; only our own panel origin is allowed
# (an empty value makes nginx omit the header).
map $http_origin $nb_media_cors {
    default                      "";
    "https://panel.noobatyar.ir" $http_origin;
}

# Owner panel caching: webpack names each .wasm by its content hash, so those
# can be cached for good; everything else (index.html, composeApp.js, the
# manifest, fonts) keeps its name across releases and must revalidate.
map $uri $nb_panel_cache {
    "~*/[0-9a-f]{16,}\.wasm$" "public, max-age=31536000, immutable";
    default                  "no-cache";
}

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────────
server {
    listen 80;
    server_name api.noobatyar.ir app.noobatyar.ir panel.noobatyar.ir;

    # Renewal uses --standalone, so this path is only a fallback for a manual
    # webroot run. It must never be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTP on the bare IP ──────────────────────────────────────────────────────
# Deliberately still serving the app. Owner-app builds already in the field
# have http://93.127.223.93 compiled into BuildKonfig, so rejecting the IP
# would brick them. Remove this block once a domain-based app build has shipped
# and the old installs are gone.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # OTP / login / forgot-password / client auth: tight per-IP limit.
    location ~ ^/api/(auth/(?!token/refresh/)|client/auth/) {
        limit_req zone=auth burst=40 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Machine-to-machine endpoints (n8n directory sync): never reachable from
    # outside; the n8n container calls web:8000 directly. ^~ beats the regex below.
    location ^~ /api/internal/ {
        return 404;
    }

    location ~ ^/(api|admin|plans|my-subscription|payment-result) {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API (Django) ─────────────────────────────────────────────────────────────
# One certificate covers both names; certbot files it under the first -d name,
# so both server blocks point at the api.noobatyar.ir directory.
server {
    listen 443 ssl;
    http2 on;
    server_name api.noobatyar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.noobatyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noobatyar.ir/privkey.pem;

    client_max_body_size 100M;

    # HSTS only: Django's SecurityMiddleware already sends nosniff and its
    # stricter Referrer-Policy (same-origin) on everything it serves here.
    # A second copy from nginx would duplicate the headers, and with two
    # Referrer-Policy values the browser takes the last, looser one.
    add_header Strict-Transport-Security $nb_hsts always;

    location /static/ {
        alias /app/static/;
    }

    # Serializers build image URLs from the request host, so a client that
    # called the API over api.noobatyar.ir gets its media from here too.
    location /media/ {
        alias /app/media/;
        add_header Strict-Transport-Security $nb_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Access-Control-Allow-Origin $nb_media_cors always;
        add_header Vary Origin always;
        # The panel's image loader can send headers that make the browser
        # preflight first; a static location answers OPTIONS with 405 and the
        # picture is dropped.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $nb_media_cors always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
    }

    # OTP / login / forgot-password / client auth: tight per-IP limit.
    location ~ ^/api/(auth/(?!token/refresh/)|client/auth/) {
        limit_req zone=auth burst=40 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}

# ── Client web app (Next.js) ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name app.noobatyar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.noobatyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noobatyar.ir/privkey.pem;

    client_max_body_size 100M;

    add_header Strict-Transport-Security $nb_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only our own pages may frame these (clickjacking). Deliberately not a
    # script/style policy yet: Next.js inlines its bootstrap scripts, and a
    # CSP that blocks them breaks the site rather than protecting it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # The Django paths are kept here on purpose even though the frontend is
    # built against https://api.noobatyar.ir: this block stays a superset of
    # what the old single-server config answered, so any relative /api/... call
    # left in the frontend keeps working instead of 404-ing after the cutover.
    # OTP / login / forgot-password / client auth: tight per-IP limit.
    location ~ ^/api/(auth/(?!token/refresh/)|client/auth/) {
        limit_req zone=auth burst=40 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Machine-to-machine endpoints (n8n directory sync): never reachable from
    # outside; the n8n container calls web:8000 directly. ^~ beats the regex below.
    location ^~ /api/internal/ {
        return 404;
    }

    location ~ ^/(api|admin|plans|my-subscription|payment-result) {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
        add_header Strict-Transport-Security $nb_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Access-Control-Allow-Origin $nb_media_cors always;
        add_header Vary Origin always;
        # The panel's image loader can send headers that make the browser
        # preflight first; a static location answers OPTIONS with 405 and the
        # picture is dropped.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $nb_media_cors always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            return 204;
        }
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Owner web panel (Kotlin/Wasm, static files) ──────────────────────────────
# The bundle is `:composeApp:wasmJsBrowserDistribution`, uploaded to
# backend/panel/ (not in git) with a .gz beside each file. It keeps the
# session tokens in localStorage, so this block carries the strict CSP from
# docs/OWNER_WEB_PLAN.md §15: scripts only from this origin (plus wasm
# compilation), and network access only to the API, the map tiles and FCM.
server {
    listen 443 ssl;
    http2 on;
    server_name panel.noobatyar.ir;

    ssl_certificate     /etc/letsencrypt/live/api.noobatyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noobatyar.ir/privkey.pem;

    root /usr/share/nginx/panel;
    index index.html;

    # The wasm is ~10 MB; serving the pre-built .gz keeps the 1-CPU host from
    # compressing it on every request.
    gzip_static on;

    add_header Strict-Transport-Security $nb_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $nb_panel_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.noobatyar.ir https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.noobatyar.ir https://tile.openstreetmap.org https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
