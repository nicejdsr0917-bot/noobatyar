<div class="modal-root" data-open="false" inert id="reason-modal" role="dialog" aria-modal="true" aria-labelledby="reason-title">
  <div class="overlay" data-close></div>
  <form method="post" class="modal p-6">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="flex items-start justify-between gap-4">
      <div><h2 id="reason-title" class="text-lg font-bold" data-reason-title>دلیل</h2>
        <p class="mt-1 text-sm text-muted-foreground" data-reason-hint></p></div>
      <button type="button" class="btn-icon" data-close aria-label="بستن"><i data-icon="x" class="size-5"></i></button>
    </div>
    <div class="field mt-5">
      <label class="label" for="reason-note">متنی که ثبت و به مالک گفته می‌شود</label>
      <textarea id="reason-note" name="note" rows="4" maxlength="255" class="input h-auto py-2.5 leading-7" data-autofocus></textarea>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" class="btn btn-outline" data-close>انصراف</button>
      <button type="submit" class="btn btn-primary" data-reason-submit>ثبت</button>
    </div>
  </form>
</div>
